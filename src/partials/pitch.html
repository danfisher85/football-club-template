<!-- Half a pitch seen from the halfway line, goal at the bottom: turf tint, mowing stripes, a grass texture and the
     markings. The band that uses it fades it out with an overlay in its own colour. Pass id (unique per use), and
     class for size, position and the line colour (currentColor). -->
<svg viewBox="0 0 68 52.5" overflow="visible" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" class="{{class}} [&_*]:[vector-effect:non-scaling-stroke]">
  <defs>
    <filter id="turf-{{id}}" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="2.4" numOctaves="3" seed="7" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer><feFuncA type="linear" slope="0.6" intercept="-0.1" /></feComponentTransfer>
    </filter>
  </defs>
  <g>
    <g stroke="none">
      <!-- The grass runs past the lines (overflow is visible), so a card edge never shows bare background -->
      <rect x="-30" y="-30" width="128" height="100" fill="rgb(84 170 96 / 0.24)" />
      <rect x="-30" y="-22.5" width="128" height="7.5" fill="rgb(255 255 255 / 0.03)" />
      <rect x="-30" y="-7.5" width="128" height="7.5" fill="rgb(255 255 255 / 0.03)" />
      <rect x="-30" y="7.5" width="128" height="7.5" fill="rgb(255 255 255 / 0.03)" />
      <rect x="-30" y="22.5" width="128" height="7.5" fill="rgb(255 255 255 / 0.03)" />
      <rect x="-30" y="37.5" width="128" height="7.5" fill="rgb(255 255 255 / 0.03)" />
      <rect x="-30" y="52.5" width="128" height="7.5" fill="rgb(255 255 255 / 0.03)" />
      <rect x="-30" y="-30" width="128" height="100" fill="white" filter="url(#turf-{{id}})" opacity="0.18" />
    </g>
    <rect x="0.5" y="0" width="67" height="52.5" />
    <path d="M24.85 0A9.15 9.15 0 0 0 43.15 0" />
    <circle cx="34" cy="0" r="0.5" fill="currentColor" stroke="none" />
    <rect x="13.85" y="36" width="40.3" height="16.5" />
    <rect x="24.85" y="47" width="18.3" height="5.5" />
    <circle cx="34" cy="41.5" r="0.5" fill="currentColor" stroke="none" />
    <path d="M26.69 36A9.15 9.15 0 0 1 41.31 36" />
    <path d="M0.5 51.5A1 1 0 0 0 1.5 52.5M66.5 52.5A1 1 0 0 0 67.5 51.5" />
  </g>
</svg>
