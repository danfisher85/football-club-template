<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    <script>
      // Apply the saved theme, or the system setting, before the page paints.
      try {
        var theme = localStorage.getItem('theme');
        if (theme === 'dark' || (!theme && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
      // Arm the blur-in reveal (js/main.js) unless the visitor prefers reduced motion. If main.js has
      // not started it within 3 seconds, show everything.
      try {
        if ('IntersectionObserver' in window && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
          document.documentElement.setAttribute('data-reveal', 'armed');
          setTimeout(function () {
            if (!window.clubRevealStarted) document.documentElement.setAttribute('data-reveal', 'off');
          }, 3000);
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body class="min-h-screen">
