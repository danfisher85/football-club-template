<!-- Result card: Scoreboard v1. Pass home, home-town, home-team (crest colour), home-score, the same
     four for away, then competition, date and datetime on the include. -->
<article data-reveal="scroll" class="flex h-full flex-col rounded-3xl border border-custom-gray-200 bg-custom-gray-100 dark:border-custom-gray-600 dark:bg-custom-gray-700">
  <div class="flex flex-1 flex-col justify-center rounded-3xl bg-white p-8 ring-1 ring-custom-gray-200 dark:bg-custom-gray-800 dark:ring-custom-gray-600">
    <div class="flex flex-col gap-5">
      <div class="flex gap-2">
        <figure><!-- @include partials/crest.html team="{{home-team}}" class="h-8 w-8" --></figure>
        <div class="min-w-0 text-custom-gray-900 dark:text-white">
          <div class="truncate text-sm/tight font-bold">{{home}}</div>
          <div class="text-xs/tight font-normal">{{home-town}}</div>
        </div>
        <div class="ms-auto text-sm/tight font-bold text-custom-gray-900 dark:text-white">{{home-score}}</div>
      </div>
      <div class="flex items-center gap-x-2">
        <div class="h-px w-8 bg-custom-gray-200 dark:bg-custom-gray-600"></div>
        <div class="text-xs-md/tight font-bold text-custom-gray-900 dark:text-white">VS</div>
        <div class="h-px flex-1 bg-custom-gray-200 dark:bg-custom-gray-600"></div>
      </div>
      <div class="flex gap-2">
        <figure><!-- @include partials/crest.html team="{{away-team}}" class="h-8 w-8" --></figure>
        <div class="min-w-0 text-custom-gray-900 dark:text-white">
          <div class="truncate text-sm/tight font-bold">{{away}}</div>
          <div class="text-xs/tight font-normal">{{away-town}}</div>
        </div>
        <div class="ms-auto text-sm/tight font-bold text-custom-gray-900 dark:text-white">{{away-score}}</div>
      </div>
    </div>
  </div>
  <div class="flex justify-between gap-2 px-8 py-4 text-xs/tight font-bold text-custom-gray-900 dark:text-white">
    <div class="truncate">{{competition}}</div>
    <time datetime="{{datetime}}">{{date}}</time>
  </div>
</article>
