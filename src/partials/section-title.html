<!-- Section title: eyebrow, heading and an optional subtitle. -->
<div class="mb-8 max-w-2xl lg:mb-10">
  <p data-reveal="scroll" class="flex items-center gap-2 text-xs font-bold tracking-wide text-custom-gray-600 uppercase dark:text-custom-gray-400">
    <!-- @include partials/crest.html team="golden" class="h-4 w-4 shrink-0" -->
    {{eyebrow}}
  </p>
  <h2 data-reveal="scroll" data-split style="--reveal-delay: 80ms" class="mt-4 text-4xl font-extrabold tracking-heading text-balance sm:text-5xl">{{title}}</h2>
  <p data-reveal="scroll" style="--reveal-delay: 250ms" class="mt-4 text-base/7 text-custom-gray empty:hidden dark:text-custom-gray-400">{{subtitle}}</p>
</div>
