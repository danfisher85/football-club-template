<!-- Squad: Player Card v1 for each player. The position tabs filter the cards by data-filter-item. -->
<section id="squad" class="club-container mt-24 scroll-mt-24 lg:mt-32" data-filter-group>
  <div class="mb-8 flex flex-wrap items-end justify-between gap-x-6 gap-y-5 lg:mb-10">
    <div>
      <p class="flex items-center gap-2 text-xs font-bold tracking-wide text-custom-gray-600 uppercase dark:text-custom-gray-400">
        <!-- @include partials/crest.html team="golden" class="h-4 w-4 shrink-0" -->
        Squad
      </p>
      <h2 class="mt-4 text-4xl font-extrabold tracking-heading sm:text-5xl">First team</h2>
    </div>
    <div class="flex max-w-full overflow-x-auto">
      <div class="inline-flex shrink-0 rounded-full bg-white p-1 text-sm ring-1 ring-custom-gray-200 dark:bg-custom-gray-800 dark:ring-custom-gray-600" role="group" aria-label="Positions">
        <button type="button" data-filter="all" aria-pressed="true" class="rounded-full px-4 py-2 font-semibold text-custom-gray aria-pressed:bg-custom-gray-900 aria-pressed:text-white dark:text-custom-gray-400 dark:aria-pressed:bg-white dark:aria-pressed:text-custom-gray-900">All</button>
        <button type="button" data-filter="gk" aria-pressed="false" class="rounded-full px-4 py-2 font-semibold text-custom-gray aria-pressed:bg-custom-gray-900 aria-pressed:text-white dark:text-custom-gray-400 dark:aria-pressed:bg-white dark:aria-pressed:text-custom-gray-900">Goalkeepers</button>
        <button type="button" data-filter="df" aria-pressed="false" class="rounded-full px-4 py-2 font-semibold text-custom-gray aria-pressed:bg-custom-gray-900 aria-pressed:text-white dark:text-custom-gray-400 dark:aria-pressed:bg-white dark:aria-pressed:text-custom-gray-900">Defenders</button>
        <button type="button" data-filter="mf" aria-pressed="false" class="rounded-full px-4 py-2 font-semibold text-custom-gray aria-pressed:bg-custom-gray-900 aria-pressed:text-white dark:text-custom-gray-400 dark:aria-pressed:bg-white dark:aria-pressed:text-custom-gray-900">Midfielders</button>
        <button type="button" data-filter="fw" aria-pressed="false" class="rounded-full px-4 py-2 font-semibold text-custom-gray aria-pressed:bg-custom-gray-900 aria-pressed:text-white dark:text-custom-gray-400 dark:aria-pressed:bg-white dark:aria-pressed:text-custom-gray-900">Forwards</button>
      </div>
    </div>
  </div>
  <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
    <div data-filter-item="gk">
      <!-- @include components/PlayerCard1.html first="Nick" last="Rodgers" img="player-7.png" number="01" position="Goalkeeper" wins="16" losses="8" points="379" -->
    </div>
    <div data-filter-item="df">
