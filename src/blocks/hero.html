<!-- Hero: the club in one card, with the next match. Replace the cut-out with your own player photo. -->
<section class="club-container pt-4 sm:pt-6">
  <div class="relative isolate overflow-hidden rounded-[2rem] bg-custom-gray-900 text-white [--card:var(--color-custom-gray-900)] sm:rounded-[2.5rem] dark:bg-custom-gray-800 dark:[--card:var(--color-custom-gray-800)]">
    <!-- Background: the pitch, an overlay in the card colour that fades it out, then a highlight and the gold glow -->
    <!-- @include partials/pitch.html id="hero" class="absolute bottom-0 left-1/2 -z-30 h-[55%] w-auto -translate-x-1/2 text-white/45 lg:left-auto lg:-right-3 lg:h-full lg:translate-x-0" -->
    <div aria-hidden="true" class="absolute inset-0 -z-20 bg-[linear-gradient(180deg,var(--card)_42%,transparent_72%)] lg:bg-[linear-gradient(90deg,var(--card)_40%,transparent_66%),linear-gradient(180deg,var(--card)_0%,transparent_45%)]"></div>
    <div aria-hidden="true" class="absolute inset-0 -z-10 bg-[linear-gradient(120deg,rgb(255_255_255/0.07),transparent_45%),radial-gradient(44rem_32rem_at_78%_64%,rgb(255_186_0/0.3),transparent_70%)]"></div>
    <div class="grid gap-8 px-6 pt-10 sm:px-10 sm:pt-14 lg:grid-cols-12 lg:gap-6 lg:px-16 lg:pt-20">
      <div class="flex flex-col items-start gap-6 pb-10 sm:pb-14 lg:col-span-7 lg:pb-20">
        <p class="flex items-center gap-2 text-xs font-bold tracking-wide text-team-golden-primary uppercase">
          <!-- @include partials/crest.html team="golden" class="h-4 w-4 shrink-0" -->
          Blocks League 2026/27
        </p>
        <h1 class="text-5xl font-extrabold tracking-heading text-balance sm:text-6xl lg:text-7xl xl:text-[5.5rem]/[0.95]">Football for the whole town</h1>
        <p class="max-w-lg text-base/7 text-white/70 sm:text-lg/7">Golden Team has played in Golden Town since 1987. The first team leads the Blocks League, and there is a place on the pitch for every age.</p>

        <!-- Next match. Point the button at your ticket shop. -->
        <div id="next-match" class="mt-2 flex w-full max-w-xl scroll-mt-28 flex-col gap-5 rounded-3xl bg-white p-5 text-custom-gray-900 sm:flex-row sm:items-center sm:justify-between sm:p-6">
          <div class="flex items-center gap-4">
            <span class="flex shrink-0 -space-x-2">
              <!-- @include partials/crest.html team="golden" class="h-10 w-10" -->
              <!-- @include partials/crest.html team="emerald" class="h-10 w-10" -->
            </span>
            <div>
              <p class="text-xs font-bold tracking-wide text-custom-gray uppercase">Next match</p>
              <p class="mt-0.5 text-base/tight font-bold">Golden Team vs Emerald Team</p>
              <p class="mt-1 text-sm/tight text-custom-gray">Tue 17 Nov, 20:30, Golden Ground</p>
            </div>
          </div>
          <a href="#" class="inline-flex h-11 shrink-0 items-center justify-center rounded-full bg-team-golden-primary px-5 text-sm font-bold text-custom-gray-900 hover:bg-custom-yellow">Buy tickets</a>
        </div>
      </div>
      <div class="relative min-h-[340px] sm:min-h-[420px] lg:col-span-5 lg:min-h-0">
        <img src="assets/img/players/player-1.png" alt="" class="absolute inset-x-0 bottom-0 mx-auto h-full w-auto drop-shadow-[0_24px_40px_rgb(0_0_0/0.45)] lg:top-[-2.5rem] lg:bottom-auto lg:h-[142%]" />
      </div>
    </div>
  </div>
</section>
